server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_carbon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "请替换为你的MySQL密码"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

carbon:
  ai:
    confidence-threshold: 0.60
    baidu:
      endpoint: https://aip.baidubce.com/rest/2.0/image-classify/v2/advanced_general
      api-key: "请替换为你的百度AI API Key"
      secret-key: "请替换为你的百度AI Secret Key"
  audit:
    enabled: true
  blockchain:
    enabled: true
    async-enabled: true
    contracts:
      carbon-points: "请替换为CarbonPoints合约部署地址"
      audit-trail: "请替换为AuditTrail合约部署地址"

app:
  request-timeout-ms: 8000
  auth:
    token: ""
