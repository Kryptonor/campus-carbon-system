server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_carbon?useSSL=false&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

carbon:
  ai:
    confidence-threshold: 0.80
    baidu:
      endpoint: https://aip.baidubce.com/rest/2.0/image-classify/v2/advanced_general
      api-key: ""
      secret-key: ""
  audit:
    # Non-tamper audit log placeholder for compliance narratives.
    enabled: true

app:
  request-timeout-ms: 8000
  auth:
    token: ""

carbon:
  blockchain:
    # Set to false in development to disable all on-chain operations.
    enabled: true
    # true: Asynchronous mode (non-blocking). false: Synchronous mode (waits for transaction confirmation).
    async-enabled: true

    contracts:
      carbon-points: "0xPASTE_CARBON_POINTS_ADDRESS_HERE"
      audit-trail: "0xPASTE_AUDIT_TRAIL_ADDRESS_HERE"
